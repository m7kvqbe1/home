<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en-gb" }}">
  <head>
    {{- partial "head.html" . }}
  </head>
  <body id="top">
    <header class="site-header">
      {{- if not .IsHome }}
      <a class="site-name" href="{{ "/" | relURL }}">{{ site.Title }}</a>
      {{- end }}
      <button class="theme-toggle" type="button" aria-label="Toggle colour scheme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </header>
    <main>
      {{- block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <span>© {{ now.Year }} Tom Humphris</span>
    </footer>
    <a class="top-link" href="#top" aria-label="Back to top" title="Back to top">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </a>
    <script>
      var topLink = document.querySelector(".top-link");
      function updateTopLink() {
        topLink.classList.toggle("visible", window.scrollY > 600);
      }
      window.addEventListener("scroll", updateTopLink, { passive: true });
      updateTopLink();
      document.querySelector(".theme-toggle").addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        localStorage.setItem("theme", next);
      });
    </script>
  </body>
</html>
