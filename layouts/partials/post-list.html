<section class="posts">
  {{- range .GroupByDate "2006" }}
  <h2 class="year">{{ .Key }}</h2>
  <ul>
    {{- range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan" }}</time>
    </li>
    {{- end }}
  </ul>
  {{- end }}
</section>
